description: >-
  The Chefs' Warehouse, Inc. (NASDAQ: CHEF) is a premier distributor of
  specialty food products to high-end independent restaurants, fine dining
  establishments, country clubs, hotels, caterers, culinary schools, bakeries,
  and specialty food stores across North America and the Middle East. The
  company offers a broad portfolio of artisan, exotic, and signature
  ingredients spanning center-of-the-plate proteins, specialty dry goods,
  produce, pastry, cheese and charcuterie, dairy and eggs, oils and vinegars,
  and kitchen supplies. Customers order through a B2B e-commerce platform
  (re-platformed to Optimizely B2B in 2021, previously Magento) and companion
  iOS and Android wholesale-ordering apps built in partnership with Unbound
  Commerce. As of this profiling, Chefs' Warehouse does not publish a public
  developer portal, API documentation, SDKs, or open-source repositories; its
  digital surface is a buyer-facing ordering experience rather than a
  programmatic API. This profile documents the company's public footprint for
  the API Evangelist network.
